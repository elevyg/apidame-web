name: db-prod

on:
  push:
    branches: [main]
    paths:
      - src/db/schema.ts
      - drizzle.config.ts
      - .github/workflows/db-prod.yml
  workflow_dispatch:

concurrency:
  group: db-prod
  cancel-in-progress: false

jobs:
  push-schema:
    name: drizzle-kit push
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TURSO_DABASE_URL: ${{ secrets.TURSO_DABASE_URL }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DABASE_URL }}
      TURSO_DATABASE_TOKEN: ${{ secrets.TURSO_DATABASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn drizzle-kit push --force
